listen_addr: ":8080"
base_url: "https://admin.pds.example.com"

session:
  # 32+ byte hex string. If the file doesn't exist, the app will create one
  # with a random 32-byte secret on first start (mode 0600). Persist this
  # across restarts, otherwise sessions are invalidated on every boot.
  secret_file: "/var/lib/pds-pro/session-secret"
  secure: true
  max_age_sec: 86400

oauth:
  # Each provider block is optional. Configure as many as you want; the login
  # page renders one button per enabled provider. Subjects in the audit log
  # are namespaced as "<provider>|<provider-user-id>" so identities stay
  # unambiguous across providers.
  okta:
    org_url: "https://example.okta.com"
    client_id: "0oaXXXXXXXXXXXXXX"
    # File contents = the Okta client secret (single line, no quotes)
    client_secret_file: "/run/secrets/pds-pro/okta-client-secret"
    callback_url: "https://admin.pds.example.com/auth/okta/callback"

  # google:
  #   client_id: "XXXXXXXXXX.apps.googleusercontent.com"
  #   client_secret_file: "/run/secrets/pds-pro/google-client-secret"
  #   callback_url: "https://admin.pds.example.com/auth/google/callback"
  #   # scopes: ["email", "profile"]   # default

  # microsoft:
  #   # Azure AD / Entra ID via the goth microsoftonline provider.
  #   # The URL path uses goth's internal name: /auth/microsoftonline/callback
  #   client_id: "00000000-0000-0000-0000-000000000000"
  #   client_secret_file: "/run/secrets/pds-pro/microsoft-client-secret"
  #   callback_url: "https://admin.pds.example.com/auth/microsoftonline/callback"

  # facebook:
  #   client_id: "0000000000000000"
  #   client_secret_file: "/run/secrets/pds-pro/facebook-client-secret"
  #   callback_url: "https://admin.pds.example.com/auth/facebook/callback"
  #   # scopes: ["email"]              # default

  # twitter:
  #   # X (Twitter) via the goth twitterv2 provider — OAuth 1.0a against the
  #   # v2 API. Scopes are not configurable for this provider.
  #   # The URL path uses goth's internal name: /auth/twitterv2/callback
  #   client_id: "XXXXXXXXXXXXXXXX"
  #   client_secret_file: "/run/secrets/pds-pro/twitter-client-secret"
  #   callback_url: "https://admin.pds.example.com/auth/twitterv2/callback"

# Operators allowed to access the app. First match wins.
# An entry with `subject` matches the OAuth provider-prefixed subject
# (e.g. "okta|00uXXXXXXXX"). `email` is exact match; `email_domain`
# matches anyone with that email domain.
allowlist:
  - subject: "okta|00uXXXXXXXXXXXXXX"
    email: "alice@sgc.ai"
    roles: ["super-admin"]
  - email_domain: "sgc.ai"
    roles: ["instance-admin"]

# PDS instances this admin app can manage. Each instance's admin password
# must live in its own file readable by the app (mode 0640, owned by the
# pds-pro user).
instances:
  - name: "pds-foo"
    pds_host: "https://pds-foo.example.com"
    admin_password_file: "/run/secrets/pds-pro/pds-foo-admin-password"
  - name: "pds-bar"
    pds_host: "https://pds-bar.example.com"
    admin_password_file: "/run/secrets/pds-pro/pds-bar-admin-password"

audit:
  # SQLite database. Required for the /audit query UI and CSV export.
  # The schema is created on first run.
  db_path: "/var/lib/pds-pro/audit.db"

  # Fallback JSON-lines file. Only used if db_path is empty. Empty/unset on
  # both = stdout. One entry per admin action and per login attempt.
  # log_path: "/var/log/pds-pro/audit.log"

goat:
  # Path to the goat binary inside the container. The Dockerfile installs
  # it at /usr/local/bin/goat.
  binary_path: "/usr/local/bin/goat"

# ---------------------------------------------------------------------------
# Cross-auth federation (atproto <-> Authentik) — OPTIONAL.
#
# When the `atproto` block is present (together with `authentik`), pds-pro
# becomes the management plane for the Discord -> Authentik -> Stoked + bsky
# "session-broker" identity model: an end user claims a handle at /claim,
# pds-pro creates the atproto account on the named instance and writes the
# DID/handle back onto the Authentik user. See the CLAUDE.md "Cross-auth
# federation" section + pds-pro memory crossauth-atproto-federation.md.
# ---------------------------------------------------------------------------

# Authentik API used to write the linked atproto identity onto users. Token =
# the svc-pds-pro-atproto-writer API token (view_user + change_user), created by
# apps/authentik/scripts/sgc/provision-atproto-writer-token.py.
# authentik:
#   base_url: "https://auth.cooey.club"            # reachable over the SGC mesh
#   token_file: "/run/secrets/pds-pro/authentik-token"

# ntfy topic alerted when an atproto provision fails (non-blocking; the user is
# flagged status=error and the reconciler retries). Optional.
# ntfy:
#   base_url: "https://ntfy.<host>"
#   topic: "eagledrive-admin"
#   token_file: "/run/secrets/pds-pro/ntfy-token"  # optional, for protected topics

# The atproto federation binding. `instance` MUST be one of the instances above.
# atproto:
#   instance: "cooey"                              # which PDS hosts claimed accounts
#   # handle_domain is the BARE, user-facing domain. It MUST drop the service
#   # prefix the PDS host carries (pds.cooey.club / bsky.cooey.club -> cooey.club)
#   # so handles render as <user>.cooey.club, never <user>.pds.cooey.club. The
#   # instance's pds_host above keeps the real (prefixed) service endpoint; this
#   # is the same split the SGC playbook does (pds_handle_domain strips "pds.").
#   handle_domain: "cooey.club"                    # handles are <localpart>.cooey.club
#   managed_password_secret_file: "/run/secrets/pds-pro/atproto-managed-secret"
#   # End-user OIDC for the self-service /claim flow (cooey brand; NOT the
#   # operator login and NOT allowlist-gated). callback_url MUST be
#   # <base_url>/claim/callback. Provisioned as its own Authentik OIDC client.
#   claim:
#     issuer_url: "https://auth.cooey.club/application/o/pds-pro-claim/"
#     client_id: "pds-pro-claim"
#     client_secret_file: "/run/secrets/pds-pro/claim-oidc-secret"
#     callback_url: "https://admin.pds.example.com/claim/callback"
#     # scopes: ["openid", "profile", "email"]     # default
